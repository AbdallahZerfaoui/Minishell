# .travis.yml
language: c         # For C projects

compiler:
  - cc             # Use GCC compiler

# Install dependencies (e.g., readline for minishell)
install:
  - sudo apt-get update
  - sudo apt-get install -y libreadline-dev
  - sudo apt-get install -y valgrind

# Build and test steps
script:
  - make        # Compile your minishell
  - make valgrind
